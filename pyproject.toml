[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-trading-system"
version = "11.8.0"
description = "Institutional-Grade Trend-Following System with Advanced Microstructure & Kelly Sizing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "polars>=0.20.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "numba>=0.58.0",
    "pyyaml>=6.0.1",
    "onnxruntime>=1.16.0",
    "statsmodels>=0.14.0",
    "pandera>=0.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
