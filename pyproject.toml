[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-trading-system"
version = "11.8.0"
description = "Institutional-Grade Trend-Following System with Advanced Microstructure & Kelly Sizing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "polars>=0.20.0",
    "pandas>=2.1.0",
    "scikit-learn>=1.3.0",
    "numba>=0.58.0",
    "pyyaml>=6.0.1",
    "onnxruntime>=1.16.0",
    "statsmodels>=0.14.0",
    "pandera>=0.16.0",
    # [FIX F41] Ba gói dưới đây TRƯỚC ĐÂY chỉ được cài tay vào .venv, không khai
    # báo ở đây. Khi .venv bị xoá (sự cố 16/09/2026), dựng lại bằng `uv pip install -e .`
    # ra một venv THIẾU chúng: không có pyarrow thì không đọc nổi parquet -> universe
    # về 0 cặp; không có requests thì không gọi nổi sàn lẫn Telegram.
    # Phụ thuộc không khai báo = venv không tái lập được = sự cố không hồi phục được.
    "pyarrow>=14.0.0",
    "requests>=2.31.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.9.0",
    "flake8>=6.1.0",
    # [FIX F41] Chỉ để `tests/research/test_literature_methods.py` chạy được.
    # LambdaRank là hướng ĐÃ THỬ VÀ THUA (CLAUDE.md §3b) nên KHÔNG phải phụ thuộc
    # lõi — nhưng thiếu nó thì 3 test đỏ, và test đỏ vì lý do sai sẽ che test đỏ
    # vì lý do đúng.
    "lightgbm>=4.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
